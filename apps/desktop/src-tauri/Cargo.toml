[package]
name = "sonasub-desktop"
version = "0.0.0"
description = "SonaSub desktop application"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
name = "sonasub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossbeam-channel = "0.5.17"
sherpa-onnx = "=2.0.1"
cpal = "=0.18.2"
fxtranslate = "=0.5.0"
adk-core = "=2.3.0"
adk-model = { version = "=2.3.0", default-features = false, features = ["openai"] }
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }
sysinfo = "0.40.3"
sha2 = "0.10.9"
ureq = { version = "2.12.1", default-features = false, features = [
  "tls",
  "gzip",
  "proxy-from-env",
] }
bzip2 = "0.4.4"
tar = "0.4.46"
zstd = "0.14.4"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }

[dev-dependencies]
hound = "3.5.1"

[profile.release.build-override]
strip = "none"
