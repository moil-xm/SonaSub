[package]
name = "sonasub-desktop"
version = "0.0.0"
description = "SonaSub desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "sonasub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "time",
  "sync",
] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.3.4"
