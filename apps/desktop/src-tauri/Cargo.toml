[package]
name = "sonasub-desktop"
version = "0.0.0"
description = "SonaSub desktop application"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "sonasub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossbeam-channel = "0.5.17"
sherpa-rs = { version = "=0.6.8", default-features = false, features = ["sys", "static"] }
flexaudio = "=0.8.1"
flexaudio-os-macos = "=0.8.1"
fxtranslate = "=0.5.0"
uuid = { version = "1.29.2", features = ["v4"] }
sysinfo = "0.40.3"
sha2 = "0.10.9"

[dev-dependencies]
hound = "3.5.1"
